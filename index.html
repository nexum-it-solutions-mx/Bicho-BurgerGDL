<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bicho Burger - Menú & Redes</title>
  <meta name="description" content="Menú digital, reseñas y pedidos de Bicho Burger.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-dark: #000000;
      --card-bg: #111111;
      --card-border: #242424;
      --white: #ffffff;
      --star-color: #fbbc04;
      --text-gray: #a1a1aa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--white);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px 40px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Contenedor del logotipo circular */
    .logo-wrapper {
      width: 130px;
      height: 130px;
      margin-bottom: 18px;
      border-radius: 50%;
      background: #000;
      box-shadow: 0 0 24px rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border: 3px solid #ffffff;
    }

    .logo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-title {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      text-transform: uppercase;
      text-align: center;
    }

    .brand-sub {
      font-size: 0.85rem;
      color: var(--text-gray);
      margin-bottom: 26px;
      text-align: center;
    }

    /* Botones de acción */
    .actions-grid {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 13px;
      margin-bottom: 32px;
    }

    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 15px 20px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 800;
      text-decoration: none;
      color: var(--white);
      background-color: var(--card-bg);
      border: 1.5px solid var(--card-border);
      transition: all 0.25s ease-in-out;
      cursor: pointer;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(255, 255, 255, 0.08);
      border-color: #555555;
    }

    /* Botón Menú */
    .btn-menu {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }
    .btn-menu:hover {
      background: #e4e4e7;
    }

    /* Botón Reseña Google */
    .btn-review {
      background: #18181b;
      border-color: #3f3f46;
      color: var(--white);
    }
    .btn-review i.fa-star {
      color: var(--star-color);
    }
    .btn-review:hover {
      border-color: var(--star-color);
      box-shadow: 0 0 16px rgba(251, 188, 4, 0.2);
    }

    .btn-instagram:hover {
      border-color: #E1306C;
      color: #E1306C;
    }

    .btn-whatsapp:hover {
      border-color: #25D366;
      color: #25D366;
    }

    /* Menú desplegable */
    .menu-container {
      width: 100%;
      display: none;
      animation: fadeIn 0.35s ease forwards;
    }

    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 10px;
    }

    .menu-header h2 {
      font-size: 1.2rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .product-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .product-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      display: flex;
      overflow: hidden;
    }

    .product-card img {
      width: 105px;
      height: 105px;
      object-fit: cover;
      flex-shrink: 0;
      background-color: #222;
    }

    .product-info {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
    }

    .product-title {
      font-size: 0.95rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .product-desc {
      font-size: 0.75rem;
      color: var(--text-gray);
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .product-price {
      font-size: 0.95rem;
      font-weight: 900;
    }

    .footer {
      margin-top: 36px;
      font-size: 0.75rem;
      color: #52525b;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Logotipo oficial -->
    <div class="logo-wrapper">
      <img src="logo.png" alt="Bicho Burger">
    </div>

    <h1 class="brand-title">Bicho Burger</h1>
    <p class="brand-sub">Smash Burgers & Snacks</p>

    <!-- Botones de Acción -->
    <div class="actions-grid">
      <!-- 1. Menú desplegable -->
      <button class="btn-action btn-menu" onclick="toggleMenu()">
        <i class="fa-solid fa-burger"></i>
        <span>Ver Menú</span>
      </button>

      <!-- 2. Google Reviews -->
      <a id="btnReview" href="https://search.google.com/local/writereview?placeid=ChIJMUwgnjKwKIQRSy-92g-0vbM" target="_blank" class="btn-action btn-review">
        <div>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
        </div>
        <span>¡Califícanos en Google!</span>
      </a>

      <!-- 3. Instagram -->
      <a id="btnInstagram" href="https://instagram.com/bichoburger" target="_blank" class="btn-action btn-instagram">
        <i class="fa-brands fa-instagram"></i>
        <span>Instagram</span>
      </a>

      <!-- 4. WhatsApp -->
      <a id="btnWhatsapp" href="https://wa.me/5213312345678?text=%C2%A1Hola%20Bicho%20Burger!%20Quiero%20hacer%20un%20pedido." target="_blank" class="btn-action btn-whatsapp">
        <i class="fa-brands fa-whatsapp"></i>
        <span>Pedir por WhatsApp</span>
      </a>
    </div>

    <!-- Menú Dinámico -->
    <section id="menuContainer" class="menu-container">
      <div class="menu-header">
        <h2>Nuestra Carta</h2>
        <span id="loadingNotice" style="font-size:0.75rem; color:var(--text-gray);">Cargando...</span>
      </div>

      <div id="productList" class="product-list"></div>
    </section>

    <div class="footer">
      Powered by Nexum IT Solutions © 2026
    </div>
  </div>

  <script>
    // Enlace público CSV de la hoja 'Menu' en Google Sheets
    const SHEET_MENU_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-REEMPLAZA_CON_TU_ID_AQUI/pub?output=csv";

    function parseCSV(text) {
      const lines = text.trim().split("\n");
      const headers = lines[0].split(",").map(h => h.trim().toLowerCase());
      
      return lines.slice(1).map(line => {
        const values = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"\vert{}"$/g, '').trim());
        const entry = {};
        headers.forEach((h, i) => entry[h] = values[i] || "");
        return entry;
      });
    }

    async function loadMenu() {
      try {
        const res = await fetch(SHEET_MENU_CSV);
        if (!res.ok) throw new Error("Error en conexión con Sheets");
        const data = parseCSV(await res.text());
        renderMenu(data);
      } catch (e) {
        // Carga de respaldo local si no hay conexión o no se ha configurado la URL
        renderMenu([
          {
            nombre: "Bicho Clásica",
            descripcion: "Carne smash 150g, queso cheddar, cebolla picada y aderezo de la casa.",
            costo: "$130",
            imagen: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400"
          },
          {
            nombre: "Bicho Diablo Doble",
            descripcion: "Doble carne smash 200g, tocino crujiente, cebolla y toque picante.",
            costo: "$175",
            imagen: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=400"
          },
          {
            nombre: "Papas Bicho",
            descripcion: "Papas fritas sazonadas con queso fundido y tocino crujiente.",
            costo: "$75",
            imagen: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=400"
          }
        ]);
      }
    }

    function renderMenu(items) {
      const list = document.getElementById("productList");
      const notice = document.getElementById("loadingNotice");
      if (notice) notice.style.display = "none";
      list.innerHTML = "";

      items.forEach(item => {
        if (!item.nombre) return;
        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
          <img src="${item.imagen || 'https://via.placeholder.com/150x150/111/fff?text=Burger'}" alt="${item.nombre}" loading="lazy">
          <div class="product-info">
            <div>
              <div class="product-title">${item.nombre}</div>
              <div class="product-desc">${item.descripcion || ''}</div>
            </div>
            <div class="product-price">${item.costo || ''}</div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function toggleMenu() {
      const menu = document.getElementById("menuContainer");
      const isVisible = menu.style.display === "block";
      menu.style.display = isVisible ? "none" : "block";
      if (!isVisible) {
        menu.scrollIntoView({ behavior: 'smooth' });
      }
    }

    document.addEventListener("DOMContentLoaded", loadMenu);
  </script>
</body>
</html>
